name: Maven verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Source and resource boundary
        shell: pwsh
        run: ./scripts/check-forbidden-imports.ps1
      - name: Resolved dependency boundary
        run: mvn -B validate -DskipTests
      - name: Dependency license allow-list
        shell: pwsh
        run: ./scripts/check-library-dependency-licenses.ps1

  binary-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Set up Coursier
        uses: coursier/setup-action@v1
      - name: MiMa against public 3.3 artifacts
        shell: pwsh
        run: ./scripts/check-binary-compatibility.ps1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Full library reactor
        run: mvn -B test
      - name: Release attachments without signing
        run: mvn -B -Prelease -Dgpg.skip=true package
