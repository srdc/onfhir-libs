# Metadata for the FHIR definitions content packaged in this artifact.
# The Maven version of this artifact tracks the onfhir-libs release line;
# the FHIR package version is recorded here.
# The file name carries the release so that several definitions artifacts can
# sit on one classpath without colliding.
#
# The definitions bundle is STU3 3.0.2 (877 resources carry version 3.0.2,
# published 2019-10-24). Note that the base CapabilityStatement inside the same
# HL7 package still declares fhirVersion 3.0.1; that inconsistency is upstream.
fhir.version=3.0.2
capability.statement.declared.version=3.0.1
package.source=https://hl7.org/fhir/STU3/definitions.json.zip
content.license=CC0-1.0
packaged.files=definitions-stu3.json.zip,conformance-statement-stu3.json
